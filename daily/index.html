<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
         background:#f4f6fa; color:#1f2937; line-height:1.6;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid #e3e8ef; border-radius:14px;
          padding:40px 48px; text-align:center; max-width:480px;
          box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .card h1 { font-size:20px; color:#0d47a1; margin-bottom:8px; }
  .card p { font-size:14px; color:#6b7280; margin-bottom:20px; }
  .card a { display:inline-block; background:#0d47a1; color:#fff;
            text-decoration:none; padding:12px 28px; border-radius:8px;
            font-size:15px; transition:background .15s; }
  .card a:hover { background:#0a3d8f; }
  .spin { margin-top:16px; color:#9ca3af; font-size:13px; }
  .spin::after { content:''; display:inline-block; width:14px; height:14px;
    border:2px solid #d1d5db; border-top:2px solid #0d47a1; border-radius:50%;
    animation:sp .6s linear infinite; vertical-align:middle; margin-left:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>

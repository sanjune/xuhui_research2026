<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; color: #333; line-height: 1.7; }
  .header { background: linear-gradient(135deg, #1a3a5f 0%, #2c5282 100%); color: #fff; padding: 36px 0; text-align: center; }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header .subtitle { font-size: 13px; margin-top: 8px; opacity: 0.8; }
  .header .meta { font-size: 12px; margin-top: 10px; opacity: 0.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  .section { background: #fff; border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .section-title { font-size: 18px; font-weight: 700; color: #1a3a5f; margin-bottom: 14px; display: flex; align-items: center; }
  .section-title::before { content: ''; width: 5px; height: 22px; background: #1890ff; border-radius: 3px; margin-right: 10px; }
  .section-subtitle { font-size: 15px; font-weight: 700; color: #1a3a5f; margin: 20px 0 10px; }
  p { margin-bottom: 10px; color: #444; font-size: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 16px 0; }
  .stat-card { background: #f6f8fa; border-radius: 8px; padding: 18px 10px; text-align: center; border: 1px solid #e8e8e8; }
  .stat-card .num { font-size: 28px; font-weight: 700; }
  .stat-card .num.red { color: #f5222d; }
  .stat-card .num.blue { color: #1890ff; }
  .stat-card .num.green { color: #52c41a; }
  .stat-card .num.orange { color: #fa8c16; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
  .data-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; }
  .data-table th { background: #1a3a5f; color: #fff; padding: 8px 10px; text-align: center; font-weight: 600; white-space: nowrap; }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid #e8e8e8; vertical-align: top; text-align: center; }
  .data-table tr:nth-child(even) { background: #fafafa; }
  .data-table tr:hover { background: #e6f7ff; }
  .table-wrap { overflow-x: auto; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.high { background: #fff1f0; color: #f5222d; border: 1px solid #ffa39e; }
  .badge.medium { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
  .strategy-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin: 1px; }
  .strategy-tag.s1 { background: #fff1f0; color: #cf1322; }
  .strategy-tag.s2 { background: #fff7e6; color: #d46b08; }
  .strategy-tag.s3 { background: #e6f7ff; color: #096dd9; }
  .strategy-tag.s4 { background: #f9f0ff; color: #531dab; }
  .content-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #666; text-align: left; }
  .note { font-size: 12px; color: #999; margin-top: 8px; }
  .two-col { display: flex; gap: 20px; margin-top: 10px; }
  .two-col > div { flex: 1; }
  
  /* Tab样式 */
  .tab-container { margin-top: 10px; }
  .tab-bar { display: flex; gap: 6px; margin-bottom: 20px; background: #f6f8fa; padding: 8px; border-radius: 10px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 80px; padding: 12px 16px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; border-radius: 8px; transition: all 0.25s; }
  .tab-btn:hover { background: #e3f2fd; color: #0d47a1; }
  .tab-btn.active { background: linear-gradient(135deg, #1a3a5f, #2c5282); color: #fff; box-shadow: 0 2px 8px rgba(26,58,95,0.3); }
  .tab-panel { display: none; animation: fadeIn 0.3s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Sub page nav */
  .sub-nav-bar { background:#fff; border-bottom:1px solid #e8e8e8; position:sticky; top:0; z-index:1000; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .sub-nav-inner { max-width:1200px; margin:0 auto; padding:0 16px; display:flex; align-items:center; height:44px; }
  .sub-nav-logo { font-size:13px; font-weight:700; color:#0d47a1; text-decoration:none; }
  .sub-nav-back { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#666; text-decoration:none; padding:4px 12px; border-radius:6px; background:#f5f5f5; transition:all 0.2s; margin-left:12px; }
  .sub-nav-back:hover { background:#e3f2fd; color:#0d47a1; }
  .sub-nav-links { margin-left:auto; display:flex; gap:12px; }
  .sub-nav-links a { font-size:12px; color:#666; text-decoration:none; }
  .sub-nav-links a:hover { color:#0d47a1; }
  .footer { text-align: center; padding: 24px 0; font-size: 12px; color: #999; }
  @media(max-width:768px) { 
    .sub-nav-links { display:none; } 
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { flex-direction: column; }
  }

  /* ===== 右侧浮动目录 ===== */
  .toc-float {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    z-index: 999;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toc-float.collapsed {
    right: -260px;
  }
  .toc-toggle {
    position: absolute;
    left: -36px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 72px;
    background: linear-gradient(180deg, #7b1fa2, #4a148c);
    color: #fff;
    border: none;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    font-size: 12px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 2px;
    box-shadow: -2px 2px 8px rgba(74,20,140,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .toc-toggle:hover {
    background: linear-gradient(180deg, #8e24aa, #6a1b9a);
    left: -38px;
    width: 38px;
  }
  .toc-panel {
    width: 260px;
    max-height: 70vh;
    background: #fff;
    border-radius: 10px 0 0 10px;
    box-shadow: -2px 4px 16px rgba(0,0,0,0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .toc-header {
    padding: 14px 18px;
    background: linear-gradient(135deg, #7b1fa2, #4a148c);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toc-header .toc-count {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .toc-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .toc-body::-webkit-scrollbar {
    width: 4px;
  }
  .toc-body::-webkit-scrollbar-thumb {
    background: #d1c4e9;
    border-radius: 2px;
  }
  .toc-item {
    display: block;
    padding: 8px 18px 8px 14px;
    font-size: 12.5px;
    color: #555;
    text-decoration: none;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.5;
  }
  .toc-item:hover {
    background: #f3e5f5;
    color: #4a148c;
    border-left-color: #ce93d8;
  }
  .toc-item.active {
    background: #f3e5f5;
    color: #4a148c;
    font-weight: 700;
    border-left-color: #7b1fa2;
  }
  .toc-item.level2 {
    padding-left: 32px;
    font-size: 11.5px;
    color: #777;
  }
  .toc-item.level2:hover {
    color: #6a1b9a;
  }
  .toc-item.level2.active {
    color: #6a1b9a;
    font-weight: 600;
  }
  .toc-sub-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .toc-item.has-sub + .toc-sub-wrap.open {
    max-height: 500px;
  }
  .toc-arrow {
    float: right;
    font-size: 10px;
    transition: transform 0.3s;
    color: #aaa;
  }
  .toc-item.has-sub.active .toc-arrow,
  .toc-item.has-sub.open .toc-arrow {
    transform: rotate(90deg);
    color: #7b1fa2;
  }
  @media(max-width: 1400px) {
    .toc-float { right: -240px; }
    .toc-float.collapsed { right: -240px; }
    .toc-float.expanded { right: 0; }
    .toc-panel { width: 240px; }
  }
  @media(max-width: 768px) {
    .toc-float { display: none; }
  }

</style>
